name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
            qt_arch: linux_gcc_64
          - os: macos-latest
            name: macos-arm64
            qt_arch: clang_64
          - os: windows-latest
            name: windows-amd64
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true

      - name: Install OpenGL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir dist
          cp build/cleanmodels-qt dist/
          strip dist/cleanmodels-qt
          cd dist && zip ../cleanmodels-qt-${{ matrix.name }}.zip cleanmodels-qt

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build/Release/cleanmodels-qt.exe dist/
          Compress-Archive -Path dist/cleanmodels-qt.exe -DestinationPath cleanmodels-qt-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cleanmodels-qt-${{ matrix.name }}
          path: "*.zip"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: "*.zip"
