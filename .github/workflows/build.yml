name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
            cmake_extra: ""
          # GitHub-hosted ARM Linux runner (public-preview as of Jan 2025,
          # free for public repos). linuxdeploy + linuxdeploy-plugin-qt
          # both ship aarch64 AppImages on their continuous channel; the
          # Linux deploy step picks the right one via `uname -m`.
          - os: ubuntu-22.04-arm
            name: linux-arm64
            cmake_extra: ""
          # Single Apple Silicon runner producing a universal2 binary
          # that runs natively on both x86_64 and arm64 Macs. Qt 6.2+
          # ships a universal macOS desktop tarball, macdeployqt copes
          # with fat .app bundles, and we lipo the bundled CLI from
          # cleanmodels' two darwin assets in the download step. Avoids
          # the macos-13 Intel runner which is queue-starved on free
          # public-repo minutes and slated for eventual deprecation.
          # Pinned: macos-latest is now macOS 26, whose SDK has no AGL
          # framework, and Qt 6.7's QtOpenGL still links it ("ld: framework
          # 'AGL' not found"). Unpin once the Qt version here drops AGL.
          - os: macos-15
            name: macos
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES='x86_64;arm64'"
          - os: windows-latest
            name: windows-amd64
            cmake_extra: ""
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}
    # The signing secrets and Azure IDs live in the tag-only "release"
    # environment, so only the macOS and Windows legs of a tag build ask for
    # it; PR and branch builds would otherwise be blocked by its tag rule.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && (matrix.name == 'macos' || matrix.name == 'windows-amd64') && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # Windows signing signs in to Azure with GitHub's OIDC token

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libxcb-cursor0 libfuse2

      - name: Configure
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Tag builds stamp the tag (without its "v") into the Windows
          # executable's version info; other builds use the CMake default.
          VERSION_ARG=""
          if [ "${REF_TYPE}" = "tag" ]; then VERSION_ARG="-DCLEANMODELS_QT_VERSION=${REF_NAME#v}"; fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ${VERSION_ARG} ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Download cleanmodels CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bundle the matching cleanmodels release alongside the GUI so a
          # single download includes both. The GUI looks for `cleanmodels`
          # on PATH or next to its own binary, so the layout below lands
          # it in the second of those slots on every platform.
          #
          # `releases/latest/download/` resolves only to non-pre-release
          # tags. That's the simple long-term URL once v4.0.0 stable is
          # cut. Until then we fall back to the most recent release of
          # any kind via `gh` so PR/CI builds during the RC window still
          # bundle something coherent.
          mkdir -p cli-bundle

          fetch_asset() {
            local asset="$1"
            local stable="https://github.com/plenarius/cleanmodels/releases/latest/download/${asset}"
            if curl -fsSL --output "cli-bundle/${asset}" "${stable}"; then
              echo "Pulled ${asset} from cleanmodels latest stable release"
            else
              echo "No stable cleanmodels release for ${asset}; falling back to most recent (incl. pre-releases)"
              local tag
              tag=$(gh release list -R plenarius/cleanmodels --limit 1 --json tagName -q '.[0].tagName')
              echo "Most recent tag: ${tag}"
              gh release download "$tag" -R plenarius/cleanmodels -p "$asset" --dir cli-bundle --clobber
            fi
          }

          case "${{ matrix.name }}" in
            macos)
              # Build a universal2 CLI from the two darwin assets so the
              # bundled binary runs natively on both Intel and Apple
              # Silicon, matching the .app's CMAKE_OSX_ARCHITECTURES.
              fetch_asset cleanmodels-darwin-amd64.zip
              fetch_asset cleanmodels-darwin-arm64.zip
              cd cli-bundle
              unzip -o cleanmodels-darwin-amd64.zip -d amd64
              unzip -o cleanmodels-darwin-arm64.zip -d arm64
              lipo -create amd64/cleanmodels-darwin-amd64 arm64/cleanmodels-darwin-arm64 \
                -output cleanmodels
              chmod +x cleanmodels
              lipo -info cleanmodels
              rm -rf amd64 arm64 cleanmodels-darwin-*.zip
              ;;
            windows-amd64)
              fetch_asset cleanmodels-windows-amd64.zip
              cd cli-bundle
              unzip -o cleanmodels-windows-amd64.zip
              mv cleanmodels-windows-amd64.exe cleanmodels.exe
              ;;
            linux-*)
              fetch_asset "cleanmodels-${{ matrix.name }}.zip"
              cd cli-bundle
              unzip -o "cleanmodels-${{ matrix.name }}.zip"
              mv "cleanmodels-${{ matrix.name }}" cleanmodels
              chmod +x cleanmodels
              ;;
            *)
              echo "Unhandled matrix name: ${{ matrix.name }}" >&2
              exit 1
              ;;
          esac

          # The case arms each `cd cli-bundle`, so list with a relative
          # path that works whether or not we're already inside it.
          ls -la "${GITHUB_WORKSPACE}/cli-bundle"

      - name: Deploy AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install to AppDir
          DESTDIR=AppDir cmake --install build

          # Bundle the cleanmodels CLI alongside the GUI inside the
          # AppImage. linuxdeploy preserves anything already in AppDir,
          # so dropping the binary in usr/bin/ before it runs is enough.
          install -Dm755 cli-bundle/cleanmodels AppDir/usr/bin/cleanmodels

          # linuxdeploy and its Qt plugin ship per-arch AppImages on the
          # continuous channel. `uname -m` resolves to x86_64 on amd64
          # runners and aarch64 on the GitHub ARM runner, which matches
          # the upstream release asset naming exactly.
          ARCH=$(uname -m)

          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${ARCH}.AppImage"
          chmod +x linuxdeploy*.AppImage

          # Convert ico to png for AppImage icon
          convert cmicon.ico[0] -resize 256x256 cleanmodels-qt.png 2>/dev/null || \
            cp icons/clean-button.png cleanmodels-qt.png

          # Build AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          "./linuxdeploy-${ARCH}.AppImage" \
            --appdir AppDir \
            --icon-file cleanmodels-qt.png \
            --desktop-file cleanmodels-qt.desktop \
            --plugin qt \
            --output appimage

          mv CleanModels_Qt*.AppImage cleanmodels-qt-${{ matrix.name }}.AppImage

      - name: Deploy (macOS)
        if: runner.os == 'macOS'
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" build/cleanmodels-qt.app -verbose=1

          # Bundle the cleanmodels CLI inside the .app next to the GUI
          # binary. macdeployqt is finished by this point so we won't
          # confuse it with extra Mach-O files; the signing step below
          # signs it along with everything else in the bundle.
          install -m 755 cli-bundle/cleanmodels build/cleanmodels-qt.app/Contents/MacOS/cleanmodels

      - name: Import signing certificate (macOS, tags)
        id: keychain
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::${KEYCHAIN_PASSWORD}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -f pkcs12 \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          # Lets codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # codesign only finds identities in keychains on the search list.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk -v team="(${TEAM_ID})" '/Developer ID Application/ && index($0, team) { print $2; exit }')
          if [ -z "$IDENTITY" ]; then
            echo "No Developer ID Application identity for team ${TEAM_ID} in the p12" >&2
            exit 1
          fi
          echo "keychain=${KEYCHAIN}" >> "$GITHUB_OUTPUT"
          echo "identity=${IDENTITY}" >> "$GITHUB_OUTPUT"

      - name: Sign (macOS)
        if: runner.os == 'macOS'
        env:
          KEYCHAIN: ${{ steps.keychain.outputs.keychain }}
          IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          APP=build/cleanmodels-qt.app
          if [ -n "$IDENTITY" ]; then
            SIGN=(codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$IDENTITY")
          else
            # Non-tag builds sign ad hoc, which exercises the same inside-out
            # order on every PR. No hardened runtime here: its library
            # validation needs a Team ID that ad hoc signatures lack.
            SIGN=(codesign --force --sign -)
          fi

          # Inside out, without --deep: loose Mach-O files first (plugins,
          # dylibs, the bundled CLI), then each framework as a bundle, then
          # the app, whose signature seals the main executable.
          while IFS= read -r -d '' f; do
            case "$f" in
              *.framework/*|"$APP/Contents/MacOS/cleanmodels-qt") continue ;;
            esac
            if file -b "$f" | grep -q 'Mach-O'; then
              "${SIGN[@]}" "$f"
            fi
          done < <(find "$APP/Contents" -type f -print0)
          while IFS= read -r -d '' fw; do
            "${SIGN[@]}" "$fw"
          done < <(find "$APP/Contents" -type d -name '*.framework' -print0)
          "${SIGN[@]}" "$APP"

          codesign --verify --strict --deep --verbose=2 "$APP"
          codesign --display --verbose=2 "$APP"

      - name: Notarize (macOS, tags)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ vars.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ vars.APPLE_NOTARY_ISSUER_ID }}
        run: |
          APP=build/cleanmodels-qt.app
          KEY="$RUNNER_TEMP/notary-key.p8"
          printf '%s\n' "$NOTARY_KEY_P8" > "$KEY"
          AUTH=(--key "$KEY" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")

          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          RESULT=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${AUTH[@]}" \
            --wait --timeout 1h --output-format json)
          echo "$RESULT"
          SUBMISSION=$(jq -r .id <<< "$RESULT")
          STATUS=$(jq -r .status <<< "$RESULT")
          # The log lists every rejected file, so print it either way.
          xcrun notarytool log "$SUBMISSION" "${AUTH[@]}" || true
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization ${STATUS}" >&2
            exit 1
          fi

          # Stapling lets Gatekeeper accept the app offline.
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl -a -vv -t exec "$APP"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        # ditto keeps the signatures and stapled ticket intact.
        run: ditto -c -k --keepParent build/cleanmodels-qt.app cleanmodels-qt-${{ matrix.name }}.zip

      - name: Remove signing keychain (macOS)
        if: always() && runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/notarize.zip"

      - name: Deploy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist\cleanmodels-qt
          Copy-Item build\Release\cleanmodels-qt.exe dist\cleanmodels-qt\
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" dist\cleanmodels-qt\cleanmodels-qt.exe --release --no-translations --no-system-d3d-compiler

          # What the tag build signs: everything here that has no signature
          # yet, in practice cleanmodels-qt.exe. Qt's DLLs already carry The
          # Qt Company's signature and keep it.
          # Listed on every build so PRs exercise the selection.
          Push-Location dist\cleanmodels-qt
          $sigs = Get-ChildItem -Recurse -Include *.exe,*.dll | Get-AuthenticodeSignature
          Pop-Location
          $sigs | Format-Table Status,@{n='Signer';e={$_.SignerCertificate.GetNameInfo('SimpleName',$false)}},@{n='File';e={Split-Path -Leaf $_.Path}} -AutoSize
          $sigs | Where-Object Status -eq NotSigned | ForEach-Object { Resolve-Path -Relative $_.Path } |
            Set-Content -Encoding ascii $env:RUNNER_TEMP\to-sign.txt

      - name: Sign (Windows, tags)
        # Authenticode signature from Azure Artifact Signing, so SmartScreen
        # and antivirus see a verified publisher. GitHub's OIDC token signs in
        # to Azure; no signing secret is stored. Signs the unsigned files the
        # deploy step listed.
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          mapfile -t FILES < <(tr -d '\r' < "$RUNNER_TEMP/to-sign.txt")
          if [ "${#FILES[@]}" -eq 0 ]; then echo "Nothing to sign" >&2; exit 1; fi

          JSIGN=jsign-7.6.jar
          curl -fsSLO "https://github.com/ebourg/jsign/releases/download/7.6/${JSIGN}"
          echo "6cf58aa080e7ff82656f320cff8d4a3bff30408df8766806dcba3740dd839fa5  ${JSIGN}" | sha256sum -c -
          OIDC="$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" | jq -r .value)"
          echo "::add-mask::${OIDC}"
          az login --service-principal -u "$AZURE_CLIENT_ID" -t "$AZURE_TENANT_ID" \
            --federated-token "$OIDC" --allow-no-subscriptions >/dev/null
          TOKEN="$(az account get-access-token --resource https://codesigning.azure.net --query accessToken -o tsv)"
          echo "::add-mask::${TOKEN}"
          java -jar "$JSIGN" --storetype TRUSTEDSIGNING --keystore eus.codesigning.azure.net \
            --storepass "$TOKEN" --alias orthartifacts/orthca-public \
            --tsaurl http://timestamp.acs.microsoft.com --tsmode RFC3161 \
            "${FILES[@]}"
          az logout
          rm -f "$JSIGN"

          pwsh -NoProfile -Command '
            $bad = Get-Content $env:RUNNER_TEMP\to-sign.txt | Get-AuthenticodeSignature |
              Where-Object Status -ne Valid
            $bad | Format-Table Status,Path -AutoSize
            Get-AuthenticodeSignature dist\cleanmodels-qt\cleanmodels-qt.exe | Format-List Status,SignerCertificate
            if ($bad) { exit 1 }'

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Bundle the cleanmodels CLI next to the GUI inside the same
          # zip, so the GUI's "alongside binary" lookup finds it without
          # extra setup on the user's part. It comes from the cleanmodels
          # release, which signs it there.
          Copy-Item cli-bundle\cleanmodels.exe dist\cleanmodels-qt\

          Compress-Archive -Path dist\cleanmodels-qt -DestinationPath cleanmodels-qt-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cleanmodels-qt-${{ matrix.name }}
          path: |
            cleanmodels-qt-*.AppImage
            cleanmodels-qt-*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum cleanmodels-qt-*.AppImage cleanmodels-qt-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            cleanmodels-qt-*.AppImage
            cleanmodels-qt-*.zip
            SHA256SUMS.txt
