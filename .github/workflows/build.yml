name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-amd64
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libxcb-cursor0 libfuse2

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Deploy AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install to AppDir
          DESTDIR=AppDir cmake --install build

          # Get linuxdeploy and Qt plugin
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          # Convert ico to png for AppImage icon
          convert cmicon.ico[0] -resize 256x256 cleanmodels-qt.png 2>/dev/null || \
            cp icons/clean-button.png cleanmodels-qt.png

          # Build AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --icon-file cleanmodels-qt.png \
            --desktop-file cleanmodels-qt.desktop \
            --plugin qt \
            --output appimage

          mv CleanModels_Qt*.AppImage cleanmodels-qt-${{ matrix.name }}.AppImage

      - name: Deploy (macOS)
        if: runner.os == 'macOS'
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" build/cleanmodels-qt.app -verbose=1
          mkdir dist
          cp -R build/cleanmodels-qt.app dist/
          cd dist && zip -r ../cleanmodels-qt-${{ matrix.name }}.zip cleanmodels-qt.app

      - name: Deploy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist\cleanmodels-qt
          Copy-Item build\Release\cleanmodels-qt.exe dist\cleanmodels-qt\
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" dist\cleanmodels-qt\cleanmodels-qt.exe --release --no-translations --no-system-d3d-compiler
          Compress-Archive -Path dist\cleanmodels-qt -DestinationPath cleanmodels-qt-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cleanmodels-qt-${{ matrix.name }}
          path: |
            *.AppImage
            *.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.AppImage
            *.zip
