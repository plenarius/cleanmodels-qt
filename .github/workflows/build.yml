name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-amd64
            cmake_extra: ""
          # GitHub-hosted ARM Linux runner (public-preview as of Jan 2025,
          # free for public repos). linuxdeploy + linuxdeploy-plugin-qt
          # both ship aarch64 AppImages on their continuous channel; the
          # Linux deploy step picks the right one via `uname -m`.
          - os: ubuntu-22.04-arm
            name: linux-arm64
            cmake_extra: ""
          # Single Apple Silicon runner producing a universal2 binary
          # that runs natively on both x86_64 and arm64 Macs. Qt 6.2+
          # ships a universal macOS desktop tarball, macdeployqt copes
          # with fat .app bundles, and we lipo the bundled CLI from
          # cleanmodels' two darwin assets in the download step. Avoids
          # the macos-13 Intel runner which is queue-starved on free
          # public-repo minutes and slated for eventual deprecation.
          - os: macos-latest
            name: macos
            cmake_extra: "-DCMAKE_OSX_ARCHITECTURES='x86_64;arm64'"
          - os: windows-latest
            name: windows-amd64
            cmake_extra: ""
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.*"
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libxcb-cursor0 libfuse2

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Download cleanmodels CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Bundle the matching cleanmodels release alongside the GUI so a
          # single download includes both. The GUI looks for `cleanmodels`
          # on PATH or next to its own binary, so the layout below lands
          # it in the second of those slots on every platform.
          #
          # `releases/latest/download/` resolves only to non-pre-release
          # tags. That's the simple long-term URL once v4.0.0 stable is
          # cut. Until then we fall back to the most recent release of
          # any kind via `gh` so PR/CI builds during the RC window still
          # bundle something coherent.
          mkdir -p cli-bundle

          fetch_asset() {
            local asset="$1"
            local stable="https://github.com/plenarius/cleanmodels/releases/latest/download/${asset}"
            if curl -fsSL --output "cli-bundle/${asset}" "${stable}"; then
              echo "Pulled ${asset} from cleanmodels latest stable release"
            else
              echo "No stable cleanmodels release for ${asset}; falling back to most recent (incl. pre-releases)"
              local tag
              tag=$(gh release list -R plenarius/cleanmodels --limit 1 --json tagName -q '.[0].tagName')
              echo "Most recent tag: ${tag}"
              gh release download "$tag" -R plenarius/cleanmodels -p "$asset" --dir cli-bundle --clobber
            fi
          }

          case "${{ matrix.name }}" in
            macos)
              # Build a universal2 CLI from the two darwin assets so the
              # bundled binary runs natively on both Intel and Apple
              # Silicon, matching the .app's CMAKE_OSX_ARCHITECTURES.
              fetch_asset cleanmodels-darwin-amd64.zip
              fetch_asset cleanmodels-darwin-arm64.zip
              cd cli-bundle
              unzip -o cleanmodels-darwin-amd64.zip -d amd64
              unzip -o cleanmodels-darwin-arm64.zip -d arm64
              lipo -create amd64/cleanmodels-darwin-amd64 arm64/cleanmodels-darwin-arm64 \
                -output cleanmodels
              chmod +x cleanmodels
              lipo -info cleanmodels
              rm -rf amd64 arm64 cleanmodels-darwin-*.zip
              ;;
            windows-amd64)
              fetch_asset cleanmodels-windows-amd64.zip
              cd cli-bundle
              unzip -o cleanmodels-windows-amd64.zip
              mv cleanmodels-windows-amd64.exe cleanmodels.exe
              ;;
            linux-*)
              fetch_asset "cleanmodels-${{ matrix.name }}.zip"
              cd cli-bundle
              unzip -o "cleanmodels-${{ matrix.name }}.zip"
              mv "cleanmodels-${{ matrix.name }}" cleanmodels
              chmod +x cleanmodels
              ;;
            *)
              echo "Unhandled matrix name: ${{ matrix.name }}" >&2
              exit 1
              ;;
          esac

          # The case arms each `cd cli-bundle`, so list with a relative
          # path that works whether or not we're already inside it.
          ls -la "${GITHUB_WORKSPACE}/cli-bundle"

      - name: Deploy AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          # Install to AppDir
          DESTDIR=AppDir cmake --install build

          # Bundle the cleanmodels CLI alongside the GUI inside the
          # AppImage. linuxdeploy preserves anything already in AppDir,
          # so dropping the binary in usr/bin/ before it runs is enough.
          install -Dm755 cli-bundle/cleanmodels AppDir/usr/bin/cleanmodels

          # linuxdeploy and its Qt plugin ship per-arch AppImages on the
          # continuous channel. `uname -m` resolves to x86_64 on amd64
          # runners and aarch64 on the GitHub ARM runner, which matches
          # the upstream release asset naming exactly.
          ARCH=$(uname -m)

          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${ARCH}.AppImage"
          wget -q "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${ARCH}.AppImage"
          chmod +x linuxdeploy*.AppImage

          # Convert ico to png for AppImage icon
          convert cmicon.ico[0] -resize 256x256 cleanmodels-qt.png 2>/dev/null || \
            cp icons/clean-button.png cleanmodels-qt.png

          # Build AppImage
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export LD_LIBRARY_PATH="$QT_ROOT_DIR/lib:$LD_LIBRARY_PATH"
          "./linuxdeploy-${ARCH}.AppImage" \
            --appdir AppDir \
            --icon-file cleanmodels-qt.png \
            --desktop-file cleanmodels-qt.desktop \
            --plugin qt \
            --output appimage

          mv CleanModels_Qt*.AppImage cleanmodels-qt-${{ matrix.name }}.AppImage

      - name: Deploy (macOS)
        if: runner.os == 'macOS'
        run: |
          "$QT_ROOT_DIR/bin/macdeployqt" build/cleanmodels-qt.app -verbose=1

          # Bundle the cleanmodels CLI inside the .app next to the GUI
          # binary. macdeployqt is finished by this point so we won't
          # confuse it with extra Mach-O files. The CLI is unsigned —
          # users opening the .app for the first time may need to clear
          # quarantine from the bundled binary the same way they do for
          # the GUI itself.
          install -m 755 cli-bundle/cleanmodels build/cleanmodels-qt.app/Contents/MacOS/cleanmodels

          mkdir dist
          cp -R build/cleanmodels-qt.app dist/
          cd dist && zip -r ../cleanmodels-qt-${{ matrix.name }}.zip cleanmodels-qt.app

      - name: Deploy (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          mkdir dist\cleanmodels-qt
          Copy-Item build\Release\cleanmodels-qt.exe dist\cleanmodels-qt\
          & "$env:QT_ROOT_DIR\bin\windeployqt.exe" dist\cleanmodels-qt\cleanmodels-qt.exe --release --no-translations --no-system-d3d-compiler

          # Bundle the cleanmodels CLI next to the GUI inside the same
          # zip, so the GUI's "alongside binary" lookup finds it without
          # extra setup on the user's part.
          Copy-Item cli-bundle\cleanmodels.exe dist\cleanmodels-qt\

          Compress-Archive -Path dist\cleanmodels-qt -DestinationPath cleanmodels-qt-${{ matrix.name }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: cleanmodels-qt-${{ matrix.name }}
          path: |
            *.AppImage
            *.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            *.AppImage
            *.zip
